<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PEACI - Multifunctional App</title>
    
    <!-- PWA Web Manifest -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <link rel="icon" type="image/png" href="peaci.png">
    <link rel="apple-touch-icon" href="peaci.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Local script link for offline barcode/QR usage -->
    <script src="html5-qrcode.min.js"></script>

    <!-- Export Libraries (PDF & Canvas Image) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        /* SKEUOMORPHIC DESIGN CSS */
        body { 
            background: radial-gradient(circle, #4b4b4b, #1a1a1a); 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: flex-start; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px;
            box-sizing: border-box;
        }

        .terminal-chassis { 
            background: linear-gradient(135deg, #e6e6e6 0%, #b3b3b3 100%); 
            width: 100%;
            max-width: 500px; 
            padding: 25px; 
            border-radius: 25px; 
            border: 2px solid #888; 
            box-shadow: 15px 15px 30px rgba(0, 0, 0, 0.6), -10px -10px 20px rgba(255, 255, 255, 0.5), inset 2px 2px 5px rgba(255, 255, 255, 0.8), inset -2px -2px 5px rgba(0, 0, 0, 0.3); 
            box-sizing: border-box;
        }

        /* ENHANCED HEADING WITH LOGO */
        .header-banner {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            background: linear-gradient(180deg, #1f2526 0%, #111415 100%);
            padding: 12px 18px;
            border-radius: 15px;
            border: 2px solid #555;
            box-shadow: inset 0 1px 2px rgba(255,255,255,0.2), 0 4px 10px rgba(0,0,0,0.5);
            margin-bottom: 15px;
        }

        .header-logo {
            width: 110px;
            height: 110px;
            object-fit: contain;
            filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.6));
        }

        .header-titles {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        .header-titles h1 { 
            text-align: left; 
            color: #ffffff; 
            text-shadow: 0px 0px 8px rgba(255,255,255,0.3); 
            margin: 0; 
            font-weight: 800; 
            letter-spacing: 1.5px; 
            font-size: 20px;
        }

        .header-titles p {
            margin: 2px 0 0 0;
            font-size: 10px;
            color: #00ffcc;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .status-badge {
            text-align: center;
            font-size: 11px;
            font-weight: bold;
            padding: 4px;
            border-radius: 5px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .status-online { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .status-offline { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

        .lcd-screen { 
            background: #0f140f; 
            color: #33ff33; 
            font-family: 'Courier New', Courier, monospace; 
            padding: 12px; 
            margin-bottom: 15px; 
            border-radius: 10px; 
            text-align: center; 
            font-size: 13px; 
            font-weight: bold; 
            box-shadow: inset 5px 5px 15px rgba(0, 0, 0, 0.9), inset -2px -2px 5px rgba(255, 255, 255, 0.1), 0px 2px 2px rgba(255,255,255, 0.8); 
            text-shadow: 0px 0px 8px #33ff33; 
            border: 4px solid #333; 
            min-height: 40px; 
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .control-panel { 
            background: linear-gradient(to bottom, #c4c4c4, #d9d9d9); 
            padding: 15px; 
            border-radius: 15px; 
            box-shadow: inset 3px 3px 8px rgba(0,0,0,0.4), inset -3px -3px 8px rgba(255,255,255,0.7); 
            margin-bottom: 15px;
        }

        button { 
            background: linear-gradient(to bottom, #f7f7f7 0%, #d4d4d4 100%); 
            border: 1px solid #a1a1a1; 
            padding: 10px 12px; 
            border-radius: 8px; 
            font-weight: bold; 
            color: #333; 
            cursor: pointer; 
            text-shadow: 1px 1px 0px rgba(255, 255, 255, 0.8); 
            box-shadow: 0px 4px 0px #888, 0px 6px 10px rgba(0, 0, 0, 0.4), inset 1px 1px 2px #fff; 
            transition: all 0.1s ease; 
            margin-bottom: 10px; 
            width: 100%; 
            box-sizing: border-box; 
            text-align: center; 
            font-size: 13px;
        }

        button:active { 
            transform: translateY(4px); 
            box-shadow: 0px 0px 0px #888, 0px 2px 5px rgba(0, 0, 0, 0.4), inset 2px 2px 5px rgba(0,0,0,0.2); 
        }

        input[type="text"], input[type="password"] { 
            width: 100%; 
            padding: 10px 12px; 
            margin-bottom: 10px; 
            background: #e8e8e8; 
            border: none; 
            border-radius: 6px; 
            font-size: 13px; 
            color: #333; 
            box-shadow: inset 3px 3px 6px rgba(0, 0, 0, 0.3), inset -2px -2px 4px rgba(255, 255, 255, 0.8), 0px 1px 1px rgba(255, 255, 255, 0.9); 
            outline: none; 
            box-sizing: border-box; 
        }

        .action-btn { 
            background: linear-gradient(to bottom, #4a90e2 0%, #003366 100%); 
            color: #fff; 
            text-shadow: none; 
            border-color: #002244; 
            box-shadow: 0px 4px 0px #001122, 0px 6px 10px rgba(0, 0, 0, 0.4), inset 1px 1px 2px rgba(255,255,255,0.4); 
        }

        .success-btn { 
            background: linear-gradient(to bottom, #2ecc71 0%, #178a4c 100%); 
            color: #fff; 
            text-shadow: none; 
            border-color: #0f5831; 
            box-shadow: 0px 4px 0px #0b3d22, 0px 6px 10px rgba(0, 0, 0, 0.4), inset 1px 1px 2px rgba(255,255,255,0.4); 
        }
        
        .danger-btn {
            background: linear-gradient(to bottom, #e74c3c 0%, #c0392b 100%);
            color: #fff;
            text-shadow: none;
            border-color: #962d22;
            box-shadow: 0px 4px 0px #78281f, 0px 6px 10px rgba(0, 0, 0, 0.4), inset 1px 1px 2px rgba(255,255,255,0.4);
        }

        .nav-btn {
            background: linear-gradient(to bottom, #7f8c8d 0%, #34495e 100%);
            color: #fff;
            text-shadow: none;
            border-color: #2c3e50;
            box-shadow: 0px 4px 0px #1a252f, 0px 6px 10px rgba(0, 0, 0, 0.4), inset 1px 1px 2px rgba(255,255,255,0.4);
        }

        label { font-size: 11px; font-weight: bold; color: #555; display: block; margin-bottom: 4px; }
        
        #reader { 
            width: 100%; 
            border-radius: 10px; 
            overflow: hidden; 
            background: #000;
            margin-bottom: 10px;
        }

        .logs-container {
            max-height: 180px;
            overflow-y: auto;
            background: #dcdcdc;
            border-radius: 8px;
            padding: 8px;
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.3);
        }

        table { width: 100%; border-collapse: collapse; font-size: 10px; }
        th, td { padding: 6px 4px; text-align: left; border-bottom: 1px solid #bbb; }
        th { background: #b0b0b0; color: #222; }

        .tag-login { color: #1e8449; font-weight: bold; }
        .tag-logout { color: #c0392b; font-weight: bold; }
        .tag-missing { color: #dc3545; font-weight: bold; background: #f8d7da; padding: 2px 4px; border-radius: 3px; }

        .hidden { display: none !important; }

        /* MODAL DIALOG STYLING */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .modal-content {
            background: linear-gradient(135deg, #2c3e50, #1a252f);
            padding: 22px;
            border-radius: 18px;
            border: 2px solid #555;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            width: 90%;
            max-width: 340px;
            text-align: center;
            color: #fff;
        }

        .modal-content h3 {
            margin-top: 0;
            font-size: 16px;
            letter-spacing: 1px;
            color: #33ff33;
        }
    </style>
</head>
<body>

    <!-- Hidden image element for PDF processing -->
    <img id="pdfLogo" src="NSTP.png" alt="NSTP Logo" style="display:none;">

    <div class="terminal-chassis">
        <!-- TOP SYSTEM HEADER WITH EMBEDDED LOGO -->
        <div class="header-banner">
            <img src="NSTP.png" alt="NSTP Logo" class="header-logo">
            <div class="header-titles">
                <h1>PEACI SYSTEM</h1>
                <p>NSTP OPERATOR TERMINAL</p>
            </div>
        </div>
        
        <!-- Network Status (Visible only when logged in) -->
        <div id="netStatus" class="status-badge status-online hidden">SYSTEM ONLINE</div>

        <div class="lcd-screen" id="statusScreen">
            <span>INITIALIZING...</span>
        </div>

        <!-- ========================================== -->
        <!-- VIEW 1: OPERATOR LOGIN                     -->
        <!-- ========================================== -->
        <div id="loginSection" class="control-panel view-section hidden">
            <label>OPERATOR LOGIN</label>
            <input type="text" id="loginUsername" placeholder="Username">
            <input type="password" id="loginPassword" placeholder="Password">
            <button class="action-btn" onclick="login()">LOGIN</button>
            <button onclick="toggleView('operatorRegisterSection')">REGISTER NEW OPERATOR</button>
        </div>

        <!-- ========================================== -->
        <!-- VIEW 2: OPERATOR REGISTRATION              -->
        <!-- ========================================== -->
        <div id="operatorRegisterSection" class="control-panel view-section hidden">
            <label>REGISTER NEW OPERATOR</label>
            <input type="text" id="regUsername" placeholder="Username (Required)">
            <input type="password" id="regPassword" placeholder="Password (Required)">
            <input type="text" id="opName" placeholder="Full Name (Teacher/Coordinator)">
            <input type="text" id="opRole" placeholder="Role (e.g. IT Instructor / Coordinator)">
            <button class="action-btn" onclick="registerOperator()">SAVE REGISTRATION</button>
            <button onclick="toggleView('loginSection')">BACK TO LOGIN</button>
        </div>

        <!-- ========================================== -->
        <!-- VIEW 3: MAIN DASHBOARD                     -->
        <!-- ========================================== -->
        <div id="dashboardSection" class="control-panel view-section hidden">
            <div style="margin-bottom: 15px; text-align: center;">
                <span id="welcomeText" style="font-weight: bold; color: #333; font-size: 14px;"></span>
            </div>

            <button class="action-btn" onclick="openAttendance()">ATTENDANCE TERMINAL</button>
            
            <a href="Schedule.html" style="text-decoration: none;">
                <button class="action-btn">SCHEDULE (EXTERNAL)</button>
            </a>

            <hr style="border: 1px solid #b5b5b5; margin: 15px 0;">

            <button class="danger-btn" onclick="logout()">LOGOUT</button>
        </div>

        <!-- ========================================== -->
        <!-- VIEW 4: ATTENDANCE TERMINAL                -->
        <!-- ========================================== -->
        <div id="attendanceSection" class="view-section hidden">
            
            <!-- ATTENDANCE ACTION MODE (LOG IN / LOG OUT) -->
            <div class="control-panel">
                <label>SELECT ATTENDANCE MODE</label>
                <div style="display: flex; gap: 10px;">
                    <button id="btnLogInMode" class="success-btn" style="margin-bottom: 0;" onclick="setAttendanceMode('LOG IN')">LOG IN</button>
                    <button id="btnLogOutMode" class="nav-btn" style="margin-bottom: 0;" onclick="setAttendanceMode('LOG OUT')">LOG OUT</button>
                </div>
            </div>

            <!-- CAMERA SCANNER SECTION -->
            <div class="control-panel">
                <label>CAMERA SCANNER (BACK CAMERA)</label>
                <div style="display: flex; gap: 8px; margin-bottom: 8px;">
                    <button class="success-btn" onclick="startCameraScanner()" style="margin-bottom: 0;">START CAMERA</button>
                    <button class="danger-btn" onclick="stopCameraScanner()" style="margin-bottom: 0;">STOP CAMERA</button>
                </div>
                <div id="reader"></div>
                
                <label style="margin-top: 10px;">MANUAL / USB SCANNER INPUT</label>
                <div style="display: flex; gap: 8px;">
                    <input type="text" id="manualScanId" placeholder="Scan or type ID Number" onkeypress="handleManualScan(event)" style="margin-bottom: 0; flex: 1;">
                    <button class="action-btn" onclick="submitManualScan()" style="width: 80px; margin-bottom: 0;">ENTER</button>
                </div>
            </div>

            <!-- COORDINATOR STUDENT REGISTRATION -->
            <div class="control-panel">
                <label>REGISTER STUDENT (TO THIS OPERATOR)</label>
                <input type="text" id="regName" placeholder="Student Full Name">
                <input type="text" id="regId" placeholder="Student ID Number">
                <input type="text" id="regCourse" placeholder="Course (e.g., BSIT, BSCS)">
                <button class="action-btn" onclick="registerStudent()">SAVE STUDENT</button>
            </div>

            <!-- ATTENDANCE LOGS -->
            <div class="control-panel">
                <label>RECENT ATTENDANCE LOGS</label>
                <div class="logs-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Time</th>
                                <th>ID Number</th>
                                <th>Name</th>
                                <th>Course</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="logTableBody">
                            <!-- Dynamic Logs -->
                        </tbody>
                    </table>
                </div>
                <button class="action-btn" onclick="openExportModal()" style="margin-top: 10px; margin-bottom: 0;">SAVE DATA</button>
            </div>

            <button class="nav-btn" onclick="closeAttendance()">RETURN TO MAIN DASHBOARD</button>
        </div>

    </div>

    <!-- EXPORT SELECTION MODAL -->
    <div id="exportModal" class="modal-overlay hidden">
        <div class="modal-content">
            <h3>SELECT EXPORT FORMAT</h3>
            <p style="font-size: 12px; color: #ccc; margin-bottom: 15px;">Choose file format to export attendance records:</p>
            <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                <button class="action-btn" onclick="exportData('pdf')">PDF FORMAT</button>
                <button class="success-btn" onclick="exportData('jpg')">JPG IMAGE</button>
            </div>
            <button class="nav-btn" onclick="closeExportModal()" style="margin-bottom: 0;">CANCEL</button>
        </div>
    </div>

    <script>
        // DOM Elements
        const statusScreen = document.getElementById('statusScreen');
        const welcomeText = document.getElementById('welcomeText');
        const netStatus = document.getElementById('netStatus');
        const logTableBody = document.getElementById('logTableBody');
        const exportModal = document.getElementById('exportModal');

        // State variables
        let activeUsername = null;
        let html5QrcodeScanner = null;
        let lastScanTime = 0;
        let lastScannedId = '';
        let currentMode = 'LOG IN'; // Default attendance mode

        // --- UTILITY FUNCTIONS ---
        function updateScreen(text, subtext = "", color = '#33ff33') {
            statusScreen.innerHTML = `<span>${text}</span>${subtext ? '<br><span style="font-size: 11px; color:#aaa;">'+subtext+'</span>' : ''}`;
            statusScreen.style.color = color;
            statusScreen.style.textShadow = `0px 0px 8px ${color}`;
        }

        function toggleView(viewId) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden'));
            document.getElementById(viewId).classList.remove('hidden');

            if (viewId === 'loginSection') updateScreen("LOGIN REQUIRED", "PLEASE ENTER CREDENTIALS", "#ffaa00");
            if (viewId === 'operatorRegisterSection') updateScreen("SETUP REQUIRED", "CREATE NEW OPERATOR", "#ffaa00");
        }

        function setAttendanceMode(mode) {
            currentMode = mode;
            const btnIn = document.getElementById('btnLogInMode');
            const btnOut = document.getElementById('btnLogOutMode');

            if (mode === 'LOG IN') {
                btnIn.className = 'success-btn';
                btnOut.className = 'nav-btn';
                updateScreen("MODE: LOG IN", "READY TO SCAN FOR ENTRY", "#33ff33");
            } else {
                btnIn.className = 'nav-btn';
                btnOut.className = 'danger-btn';
                updateScreen("MODE: LOG OUT", "READY TO SCAN FOR EXIT", "#ffaa00");
            }
        }

        function openExportModal() { exportModal.classList.remove('hidden'); }
        function closeExportModal() { exportModal.classList.add('hidden'); }

        // --- DYNAMIC STORAGE KEYS ---
        function getStudentDBKey() { return `peaci_students_${activeUsername}`; }
        function getAttendanceKey() { return `peaci_logs_${activeUsername}`; }
        function getUsersDB() { return JSON.parse(localStorage.getItem('peaci_users_db')) || {}; }

        // --- INITIALIZATION ---
        window.addEventListener('load', () => {
            checkOperatorState();
            registerServiceWorker();
            
            window.addEventListener('online', updateOnlineStatus);
            window.addEventListener('offline', updateOnlineStatus);
        });

        function registerServiceWorker() {
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('./sw.js')
                    .catch((err) => console.log('SW registration failed:', err));
            }
        }

        function updateOnlineStatus() {
            if (!activeUsername) return;
            if (navigator.onLine) {
                netStatus.textContent = "SYSTEM ONLINE";
                netStatus.className = "status-badge status-online";
                netStatus.classList.remove('hidden');
            } else {
                netStatus.textContent = "OFFLINE MODE";
                netStatus.className = "status-badge status-offline";
                netStatus.classList.remove('hidden');
            }
        }

        // --- AUTHENTICATION LOGIC ---
        function checkOperatorState() {
            const session = localStorage.getItem('peaci_active_session');
            if (!session) {
                activeUsername = null;
                netStatus.classList.add('hidden');
                toggleView('loginSection');
                updateScreen("LOGIN REQUIRED", "PLEASE ENTER CREDENTIALS", "#ffaa00");
            } else {
                const activeUser = JSON.parse(session);
                activeUsername = activeUser.username;
                welcomeText.textContent = `Welcome, ${activeUser.name} (${activeUser.role})`;
                
                if (!localStorage.getItem(getStudentDBKey())) localStorage.setItem(getStudentDBKey(), JSON.stringify({}));
                if (!localStorage.getItem(getAttendanceKey())) localStorage.setItem(getAttendanceKey(), JSON.stringify([]));

                updateOnlineStatus();
                toggleView('dashboardSection');
                updateScreen("SYSTEM READY", "SELECT A SERVICE BELOW");
            }
        }

        function registerOperator() {
            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value.trim();
            const name = document.getElementById('opName').value.trim();
            const role = document.getElementById('opRole').value.trim();

            if (!username || !password || !name || !role) {
                updateScreen("ERROR", "FILL OUT ALL FIELDS", "#ff3333");
                return;
            }

            const usersDB = getUsersDB();
            if (usersDB[username]) {
                updateScreen("ERROR", "USERNAME ALREADY EXISTS", "#ff3333");
                return;
            }

            usersDB[username] = { password, name, role };
            localStorage.setItem('peaci_users_db', JSON.stringify(usersDB));
            
            document.getElementById('regUsername').value = '';
            document.getElementById('regPassword').value = '';
            document.getElementById('opName').value = '';
            document.getElementById('opRole').value = '';

            updateScreen("SUCCESS", "OPERATOR SAVED. PLEASE LOGIN.", "#33ff33");
            toggleView('loginSection');
        }

        function login() {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            const usersDB = getUsersDB();
            const user = usersDB[username];

            if (user && user.password === password) {
                localStorage.setItem('peaci_active_session', JSON.stringify({ username, name: user.name, role: user.role }));
                document.getElementById('loginUsername').value = '';
                document.getElementById('loginPassword').value = '';
                checkOperatorState();
            } else {
                updateScreen("ACCESS DENIED", "INVALID CREDENTIALS", "#ff3333");
            }
        }

        function logout() {
            if (confirm("Are you sure you want to logout?")) {
                localStorage.removeItem('peaci_active_session');
                activeUsername = null;
                checkOperatorState();
            }
        }

        // --- ATTENDANCE SYSTEM LOGIC ---
        function openAttendance() {
            toggleView('attendanceSection');
            setAttendanceMode('LOG IN');
            renderLogs();
        }

        function closeAttendance() {
            stopCameraScanner();
            toggleView('dashboardSection');
            updateScreen("SYSTEM READY", "SELECT A SERVICE BELOW");
        }

        function registerStudent() {
            const name = document.getElementById('regName').value.trim();
            const idNumber = document.getElementById('regId').value.trim();
            const course = document.getElementById('regCourse').value.trim();

            if (!name || !idNumber || !course) {
                updateScreen("REGISTRATION ERROR", "FILL OUT ALL FIELDS", "#ff3333");
                return;
            }

            const dbKey = getStudentDBKey();
            let db = JSON.parse(localStorage.getItem(dbKey)) || {};
            db[idNumber] = { name: name, course: course };
            localStorage.setItem(dbKey, JSON.stringify(db));

            updateScreen("SUCCESS", `SAVED: ${name.toUpperCase()}`);
            document.getElementById('regName').value = '';
            document.getElementById('regId').value = '';
            document.getElementById('regCourse').value = '';
        }

        function processAttendance(scannedId) {
            const cleanId = scannedId.trim();
            if (!cleanId) return;

            const now = Date.now();
            if (cleanId === lastScannedId && (now - lastScanTime) < 3000) return; 
            
            lastScanTime = now;
            lastScannedId = cleanId;

            const dbKey = getStudentDBKey();
            const logKey = getAttendanceKey();

            let db = JSON.parse(localStorage.getItem(dbKey)) || {};
            let logs = JSON.parse(localStorage.getItem(logKey)) || [];

            if (db[cleanId]) {
                const student = db[cleanId];
                const nowObj = new Date();
                const dateStr = nowObj.toLocaleDateString();
                const timeStr = nowObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

                const alreadyScanned = logs.some(log => log.id === cleanId && log.date === dateStr && log.mode === currentMode);

                if (alreadyScanned) {
                    updateScreen("ALREADY SCANNED", `${student.name.toUpperCase()} HAS ALREADY ${currentMode}`, "#ffaa00");
                    return;
                }

                const record = {
                    date: dateStr,
                    time: timeStr,
                    id: cleanId,
                    name: student.name,
                    course: student.course,
                    mode: currentMode
                };

                logs.unshift(record);
                localStorage.setItem(logKey, JSON.stringify(logs));

                updateScreen(`${currentMode} SUCCESS`, `${student.name.toUpperCase()} (${student.course})`);
                renderLogs();
            } else {
                updateScreen("ACCESS DENIED", `ID ${cleanId} NOT REGISTERED`, "#ff3333");
            }
        }

        function handleManualScan(e) {
            if (e.key === 'Enter') {
                submitManualScan();
            }
        }

        function submitManualScan() {
            const inputField = document.getElementById('manualScanId');
            processAttendance(inputField.value);
            inputField.value = '';
        }

        function startCameraScanner() {
            if (typeof Html5QrcodeScanner === 'undefined') {
                alert("Scanner library loading or unavailable.");
                return;
            }

            if (!html5QrcodeScanner) {
                html5QrcodeScanner = new Html5QrcodeScanner(
                    "reader", 
                    { 
                        fps: 10, 
                        qrbox: { width: 200, height: 150 },
                        facingMode: "environment"
                    },
                    false
                );
                html5QrcodeScanner.render((decodedText) => {
                    processAttendance(decodedText);
                }, (error) => { /* Scanning... */ });
                updateScreen("CAMERA ACTIVE", "READY TO SCAN QR/BARCODE", "#33ff33");
            }
        }

        function stopCameraScanner() {
            if (html5QrcodeScanner) {
                html5QrcodeScanner.clear().then(() => {
                    html5QrcodeScanner = null;
                    updateScreen("CAMERA STOPPED", "USE MANUAL INPUT OR START CAMERA");
                }).catch(err => {
                    console.error("Failed to clear scanner", err);
                    html5QrcodeScanner = null;
                    updateScreen("CAMERA STOPPED", "USE MANUAL INPUT OR START CAMERA");
                });
            }
        }

        function renderLogs() {
            let logs = JSON.parse(localStorage.getItem(getAttendanceKey())) || [];
            logTableBody.innerHTML = '';

            logs.slice(0, 15).forEach(log => {
                const row = document.createElement('tr');
                let tagClass = log.mode === 'LOG IN' ? 'tag-login' : 'tag-logout';
                let modeLabel = log.mode || 'LOG IN';
                
                row.innerHTML = `
                    <td>${log.date || '-'}</td>
                    <td>${log.time || '-'}</td>
                    <td>${log.id || '-'}</td>
                    <td>${log.name || '-'}</td>
                    <td>${log.course || '-'}</td>
                    <td class="${tagClass}">${modeLabel}</td>
                `;
                logTableBody.appendChild(row);
            });
        }

        function getProcessedAttendanceData() {
            const logs = JSON.parse(localStorage.getItem(getAttendanceKey())) || [];
            let processedData = {};

            [...logs].reverse().forEach(log => {
                let key = log.id;

                if (!processedData[key]) {
                    let formattedName = log.name.trim();
                    if (!formattedName.includes(',')) {
                        let parts = formattedName.split(/\s+/);
                        if (parts.length > 1) {
                            const lastName = parts.pop();
                            formattedName = `${lastName}, ${parts.join(' ')}`;
                        }
                    }

                    processedData[key] = {
                        name: formattedName.toUpperCase(),
                        id: log.id,
                        course: log.course,
                        login: "NO LOG IN",
                        logout: "NO LOG OUT"
                    };
                }

                if (log.mode === 'LOG IN') {
                    if (processedData[key].login === "NO LOG IN") {
                        processedData[key].login = log.time;
                    }
                } else if (log.mode === 'LOG OUT') {
                    processedData[key].logout = log.time;
                }
            });

            return Object.values(processedData).sort((a, b) => a.name.localeCompare(b.name));
        }

        function exportData(type) {
            closeExportModal();
            const records = getProcessedAttendanceData();
            
            if (records.length === 0) {
                alert("No attendance records found to export.");
                return;
            }

            if (type === 'pdf') {
                generatePDF(records);
            } else if (type === 'jpg') {
                generateJPG(records);
            }
        }

        function generatePDF(records) {
            if (!window.jspdf) {
                alert("PDF library loading. Please check connection.");
                return;
            }

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const pageWidth = doc.internal.pageSize.getWidth();
            let y = 12; // Initial top margin

            const imgElement = document.getElementById('pdfLogo');
            try {
                if (imgElement) {
                    const canvas = document.createElement("canvas");
                    canvas.width = imgElement.naturalWidth || 100;
                    canvas.height = imgElement.naturalHeight || 100;
                    const ctx = canvas.getContext("2d");
                    ctx.drawImage(imgElement, 0, 0);
                    const imgData = canvas.toDataURL("image/png");
                    
                    // Proportional scaling based on natural aspect ratio
                    const natW = imgElement.naturalWidth || 200;
                    const natH = imgElement.naturalHeight || 100;
                    const imgWidth = 24; // fixed width in mm
                    const imgHeight = (natH / natW) * imgWidth; // proportional height calculation
                    
                    // Corrected: (pageWidth - imgWidth) / 2 centers the logo horizontally
                    doc.addImage(imgData, 'PNG', (pageWidth - imgWidth) / 2, y, imgWidth, imgHeight);
                    
                    // Increased gap between the logo and the school title text
                    y += imgHeight + 4; 
                }
            } catch (e) {
                y += 5;
            }

            doc.setFont("times", "bold");
            doc.setFontSize(11);
            doc.text("Philippine Engineering and Agro- Industrial College, Inc.", pageWidth / 2, y, { align: 'center' });
            
            y += 4;
            doc.setFontSize(9);
            doc.text("NSTP-CWTS", pageWidth / 2, y, { align: 'center' });
            
            y += 4;
            doc.setFont("times", "normal");
            doc.setFontSize(9);
            const dateStr = new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
            doc.text(`Date: ${dateStr}`, pageWidth / 2, y, { align: 'center' });

            y += 3;
            doc.setLineWidth(0.5);
            doc.line(14, y, pageWidth - 14, y);
            y += 4;

            const tableRows = records.map((row, index) => [index + 1, row.name, row.id, row.course, row.login, row.logout]);
            const tableColumn = ["#", "Name", "ID Number", "Course", "Login", "Logout"];

            doc.autoTable({
                head: [tableColumn],
                body: tableRows,
                startY: y,
                theme: 'grid',
                styles: { font: 'times', fontSize: 8.5, cellPadding: 2.2 },
                headStyles: { fillColor: [44, 62, 80], halign: 'center', fontSize: 9 },
                columnStyles: {
                    0: { cellWidth: 10, halign: 'center' },
                    1: { cellWidth: 'auto' },
                    2: { halign: 'center', cellWidth: 28 },
                    3: { halign: 'center', cellWidth: 28 },
                    4: { halign: 'center', cellWidth: 22 },
                    5: { halign: 'center', cellWidth: 22 }
                },
                didParseCell: function(data) {
                    if (data.section === 'body' && (data.column.index === 4 || data.column.index === 5)) {
                        if (data.cell.raw === 'NO LOG IN' || data.cell.raw === 'NO LOG OUT') {
                            data.cell.styles.textColor = [220, 53, 69];
                            data.cell.styles.fontStyle = 'bold';
                        }
                    }
                }
            });

            let finalY = doc.lastAutoTable.finalY + 10;
            if (finalY > doc.internal.pageSize.getHeight() - 30) {
                doc.addPage();
                finalY = 20;
            }

            const session = JSON.parse(localStorage.getItem('peaci_active_session')) || { name: 'OPERATOR', role: 'Coordinator' };
            
            doc.setFont("times", "normal");
            doc.setFontSize(9);
            doc.text("Prepared by:", 14, finalY);
            
            finalY += 8;
            const sigX = 14;
            const sigWidth = 60;
            const centerX = sigX + (sigWidth / 2);

            doc.setFont("times", "bold");
            doc.text(session.name.toUpperCase(), centerX, finalY, { align: 'center' });
            
            const nameWidth = doc.getTextWidth(session.name.toUpperCase());
            doc.setLineWidth(0.3);
            doc.line(centerX - (nameWidth / 2), finalY + 1, centerX + (nameWidth / 2), finalY + 1);
            
            finalY += 5;
            doc.setFont("times", "normal");
            doc.text(`${session.role}`, centerX, finalY, { align: 'center' });

            doc.save(`NSTP_Attendance_${new Date().toISOString().slice(0,10)}.pdf`);
        }

        function generateJPG(records) {
            const dateStr = new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
            const session = JSON.parse(localStorage.getItem('peaci_active_session')) || { name: 'OPERATOR', role: 'Coordinator' };

            const exportContainer = document.createElement('div');
            exportContainer.style.position = 'fixed';
            exportContainer.style.top = '0';
            exportContainer.style.left = '-9999px';
            exportContainer.style.width = '1240px';
            exportContainer.style.minHeight = '1754px';
            exportContainer.style.background = '#ffffff';
            exportContainer.style.padding = '50px 60px';
            exportContainer.style.boxSizing = 'border-box';
            exportContainer.style.fontFamily = 'Times New Roman, Times, serif';
            exportContainer.style.color = '#000000';
            exportContainer.style.zIndex = '-999';

            let tableRowsHtml = records.map((r, index) => `
                <tr>
                    <td style="border: 1px solid #333; padding: 6px; font-size: 13px; text-align: center; width: 40px;">${index + 1}</td>
                    <td style="border: 1px solid #333; padding: 6px 10px; font-size: 13px;">${r.name}</td>
                    <td style="border: 1px solid #333; padding: 6px; font-size: 13px; text-align: center; width: 160px;">${r.id}</td>
                    <td style="border: 1px solid #333; padding: 6px; font-size: 13px; text-align: center; width: 140px;">${r.course}</td>
                    <td style="border: 1px solid #333; padding: 6px; font-size: 13px; text-align: center; width: 130px; ${r.login === 'NO LOG IN' ? 'color: #dc3545; font-weight: bold;' : ''}">${r.login}</td>
                    <td style="border: 1px solid #333; padding: 6px; font-size: 13px; text-align: center; width: 130px; ${r.logout === 'NO LOG OUT' ? 'color: #dc3545; font-weight: bold;' : ''}">${r.logout}</td>
                </tr>
            `).join('');

            const logoHtml = '<img src="NSTP.png" style="width: 140px; height: 70px; object-fit: contain; margin-bottom: 5px; display: block; margin-left: auto; margin-right: auto;">';

            exportContainer.innerHTML = `
                <div style="text-align: center; margin-bottom: 15px;">
                    ${logoHtml}
                    <h2 style="margin: 0; font-size: 18px; font-weight: bold;">Philippine Engineering and Agro- Industrial College, Inc.</h2>
                    <h3 style="margin: 4px 0; font-size: 15px; font-weight: normal;">NSTP-CWTS</h3>
                    <p style="margin: 2px 0; font-size: 13px;">Date: ${dateStr}</p>
                    <hr style="border: none; border-top: 1.5px solid #000; margin-top: 10px;">
                </div>
                <table style="width: 100%; border-collapse: collapse; margin-bottom: 20px;">
                    <thead>
                        <tr style="background: #2c3e50; color: #ffffff;">
                            <th style="border: 1px solid #333; padding: 8px; font-size: 13px; text-align: center;">#</th>
                            <th style="border: 1px solid #333; padding: 8px 10px; font-size: 13px; text-align: left;">Name</th>
                            <th style="border: 1px solid #333; padding: 8px; font-size: 13px; text-align: center;">ID Number</th>
                            <th style="border: 1px solid #333; padding: 8px; font-size: 13px; text-align: center;">Course</th>
                            <th style="border: 1px solid #333; padding: 8px; font-size: 13px; text-align: center;">Login</th>
                            <th style="border: 1px solid #333; padding: 8px; font-size: 13px; text-align: center;">Logout</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${tableRowsHtml}
                    </tbody>
                </table>
                <div style="font-size: 13px; margin-top: 15px; display: inline-block;">
                    <p style="margin: 0;">Prepared by:</p>
                    <div style="margin-top: 20px; text-align: center; display: inline-block; min-width: 180px;">
                        <p style="margin: 0 0 2px 0; font-weight: bold; font-size: 14px; text-decoration: underline; display: inline-block;">${session.name.toUpperCase()}</p>
                        <p style="margin: 2px 0 0 0; font-size: 13px; text-align: center;">${session.role}</p>
                    </div>
                </div>
            `;

            document.body.appendChild(exportContainer);

            html2canvas(exportContainer, { 
                scale: 1,
                width: 1240,
                windowWidth: 1240,
                backgroundColor: "#ffffff",
                useCORS: true
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = `NSTP_Attendance_A4_${new Date().toISOString().slice(0,10)}.jpg`;
                link.href = canvas.toDataURL('image/jpeg', 0.95);
                link.click();
                document.body.removeChild(exportContainer);
            }).catch(err => {
                console.error("JPG Export Error:", err);
                alert("Failed to generate JPG image.");
                document.body.removeChild(exportContainer);
            });
        }
    </script>
