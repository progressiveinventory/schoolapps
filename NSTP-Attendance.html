<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PEACI - Attendance Terminal</title>
    <link rel="manifest" href="manifest.json">
    <!-- Local script link for complete offline usage -->
    <script src="html5-qrcode.min.js"></script>
    
    <style>
        /* SKEUOMORPHIC DESIGN CSS */
        body { 
            background: radial-gradient(circle, #4b4b4b, #1a1a1a); 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: flex-start; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px;
            box-sizing: border-box;
        }

        .terminal-chassis { 
            background: linear-gradient(135deg, #e6e6e6 0%, #b3b3b3 100%); 
            width: 100%;
            max-width: 500px; 
            padding: 25px; 
            border-radius: 25px; 
            border: 2px solid #888; 
            box-shadow: 15px 15px 30px rgba(0, 0, 0, 0.6), -10px -10px 20px rgba(255, 255, 255, 0.5), inset 2px 2px 5px rgba(255, 255, 255, 0.8), inset -2px -2px 5px rgba(0, 0, 0, 0.3); 
            box-sizing: border-box;
        }

        h1 { 
            text-align: center; 
            color: #444; 
            text-shadow: 1px 1px 2px #fff, -1px -1px 2px #999; 
            margin-top: 0; 
            font-weight: 800; 
            letter-spacing: 2px; 
            font-size: 20px;
        }

        .status-badge {
            text-align: center;
            font-size: 11px;
            font-weight: bold;
            padding: 4px;
            border-radius: 5px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .status-online { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .status-offline { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

        .lcd-screen { 
            background: #0f140f; 
            color: #33ff33; 
            font-family: 'Courier New', Courier, monospace; 
            padding: 12px; 
            margin-bottom: 15px; 
            border-radius: 10px; 
            text-align: center; 
            font-size: 13px; 
            font-weight: bold; 
            box-shadow: inset 5px 5px 15px rgba(0, 0, 0, 0.9), inset -2px -2px 5px rgba(255, 255, 255, 0.1), 0px 2px 2px rgba(255,255,255, 0.8); 
            text-shadow: 0px 0px 8px #33ff33; 
            border: 4px solid #333; 
            min-height: 40px; 
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .control-panel { 
            background: linear-gradient(to bottom, #c4c4c4, #d9d9d9); 
            padding: 15px; 
            border-radius: 15px; 
            box-shadow: inset 3px 3px 8px rgba(0,0,0,0.4), inset -3px -3px 8px rgba(255,255,255,0.7); 
            margin-bottom: 15px;
        }

        button { 
            background: linear-gradient(to bottom, #f7f7f7 0%, #d4d4d4 100%); 
            border: 1px solid #a1a1a1; 
            padding: 10px 12px; 
            border-radius: 8px; 
            font-weight: bold; 
            color: #333; 
            cursor: pointer; 
            text-shadow: 1px 1px 0px rgba(255, 255, 255, 0.8); 
            box-shadow: 0px 4px 0px #888, 0px 6px 10px rgba(0, 0, 0, 0.4), inset 1px 1px 2px #fff; 
            transition: all 0.1s ease; 
            margin-bottom: 10px; 
            width: 100%; 
            box-sizing: border-box; 
            text-align: center; 
            font-size: 13px;
        }

        button:active { 
            transform: translateY(4px); 
            box-shadow: 0px 0px 0px #888, 0px 2px 5px rgba(0, 0, 0, 0.4), inset 2px 2px 5px rgba(0,0,0,0.2); 
        }

        input[type="text"] { 
            width: 100%; 
            padding: 10px 12px; 
            margin-bottom: 10px; 
            background: #e8e8e8; 
            border: none; 
            border-radius: 6px; 
            font-size: 13px; 
            color: #333; 
            box-shadow: inset 3px 3px 6px rgba(0, 0, 0, 0.3), inset -2px -2px 4px rgba(255, 255, 255, 0.8), 0px 1px 1px rgba(255, 255, 255, 0.9); 
            outline: none; 
            box-sizing: border-box; 
        }

        .action-btn { 
            background: linear-gradient(to bottom, #4a90e2 0%, #003366 100%); 
            color: #fff; 
            text-shadow: none; 
            border-color: #002244; 
            box-shadow: 0px 4px 0px #001122, 0px 6px 10px rgba(0, 0, 0, 0.4), inset 1px 1px 2px rgba(255,255,255,0.4); 
        }

        .nav-btn {
            background: linear-gradient(to bottom, #7f8c8d 0%, #34495e 100%);
            color: #fff;
            text-shadow: none;
            border-color: #2c3e50;
            box-shadow: 0px 4px 0px #1a252f, 0px 6px 10px rgba(0, 0, 0, 0.4), inset 1px 1px 2px rgba(255,255,255,0.4);
            text-decoration: none;
            display: block;
        }

        label { font-size: 11px; font-weight: bold; color: #555; display: block; margin-bottom: 4px; }
        
        #reader { 
            width: 100%; 
            border-radius: 10px; 
            overflow: hidden; 
            background: #000;
            margin-bottom: 10px;
        }

        /* Attendance Table Styling */
        .logs-container {
            max-height: 180px;
            overflow-y: auto;
            background: #dcdcdc;
            border-radius: 8px;
            padding: 8px;
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.3);
        }

        table { width: 100%; border-collapse: collapse; font-size: 11px; }
        th, td { padding: 6px 8px; text-align: left; border-bottom: 1px solid #bbb; }
        th { background: #b0b0b0; color: #222; }
        
        .sync-badge { font-weight: bold; font-size: 10px; }
        .synced { color: #198754; }
        .pending { color: #d97706; }
    </style>
</head>
<body>

    <div class="terminal-chassis">
        <h1>ATTENDANCE TERMINAL</h1>
        
        <div id="netStatus" class="status-badge status-online">SYSTEM ONLINE</div>

        <div class="lcd-screen" id="statusScreen">
            <span>SCANNER READY</span>
            <span style="font-size: 11px; color:#aaa;">PRESENT ID OR SCAN BARCODE</span>
        </div>

        <!-- CAMERA SCANNER SECTION -->
        <div class="control-panel">
            <label>CAMERA SCANNER</label>
            <div id="reader"></div>
            
            <label style="margin-top: 10px;">MANUAL / USB SCANNER INPUT</label>
            <input type="text" id="manualScanId" placeholder="Scan or type ID Number & press Enter" onkeypress="handleManualScan(event)">
        </div>

        <!-- COORDINATOR STUDENT REGISTRATION -->
        <div class="control-panel">
            <label>COORDINATOR: REGISTER STUDENT</label>
            <input type="text" id="regName" placeholder="Student Full Name">
            <input type="text" id="regId" placeholder="Student ID Number">
            <input type="text" id="regCourse" placeholder="Course (e.g., BSIT, BSCS)">
            <button class="action-btn" onclick="registerStudent()">SAVE STUDENT TO SYSTEM</button>
        </div>

        <!-- ATTENDANCE LOGS -->
        <div class="control-panel">
            <label>RECENT ATTENDANCE LOGS</label>
            <div class="logs-container">
                <table>
                    <thead>
                        <tr>
                            <th>Time</th>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Course</th>
                            <th>Sync</th>
                        </tr>
                    </thead>
                    <tbody id="logTableBody">
                        <!-- Dynamic Logs -->
                    </tbody>
                </table>
            </div>
            <button onclick="syncAttendance()" style="margin-top: 10px; margin-bottom: 0;">FORCE SYNC SERVER</button>
        </div>

        <a href="index.html" style="text-decoration: none;">
            <button class="nav-btn">RETURN TO MAIN DASHBOARD</button>
        </a>
    </div>

    <script>
        const statusScreen = document.getElementById('statusScreen');
        const logTableBody = document.getElementById('logTableBody');
        const netStatus = document.getElementById('netStatus');
        let lastScanTime = 0;
        let lastScannedId = '';

        // Initialize Local Storage Databases
        if (!localStorage.getItem('peaci_db')) {
            localStorage.setItem('peaci_db', JSON.stringify({}));
        }
        if (!localStorage.getItem('peaci_attendance')) {
            localStorage.setItem('peaci_attendance', JSON.stringify([]));
        }

        window.onload = function() {
            renderLogs();
            initScanner();
            updateOnlineStatus();
        };

        // Network Status Indicator & Auto-Sync
        function updateOnlineStatus() {
            if (navigator.onLine) {
                netStatus.textContent = "SYSTEM ONLINE";
                netStatus.className = "status-badge status-online";
                syncAttendance();
            } else {
                netStatus.textContent = "OFFLINE MODE (SAVING LOCALLY)";
                netStatus.className = "status-badge status-offline";
            }
        }
        window.addEventListener('online', updateOnlineStatus);
        window.addEventListener('offline', updateOnlineStatus);

        function updateScreen(text, subtext = "", color = '#33ff33') {
            statusScreen.innerHTML = `<span>${text}</span>${subtext ? '<br><span style="font-size: 11px; color:#aaa;">'+subtext+'</span>' : ''}`;
            statusScreen.style.color = color;
            statusScreen.style.textShadow = `0px 0px 8px ${color}`;
        }

        /* --- REGISTER STUDENT --- */
        function registerStudent() {
            const name = document.getElementById('regName').value.trim();
            const idNumber = document.getElementById('regId').value.trim();
            const course = document.getElementById('regCourse').value.trim();

            if (!name || !idNumber || !course) {
                updateScreen("REGISTRATION ERROR", "FILL OUT ALL FIELDS", "#ff3333");
                return;
            }

            let db = JSON.parse(localStorage.getItem('peaci_db'));
            db[idNumber] = { name: name, course: course };
            localStorage.setItem('peaci_db', JSON.stringify(db));

            updateScreen("SUCCESS", `SAVED: ${name.toUpperCase()}`);
            
            document.getElementById('regName').value = '';
            document.getElementById('regId').value = '';
            document.getElementById('regCourse').value = '';
        }

        /* --- PROCESS SCANNED ID --- */
        function processAttendance(scannedId) {
            const cleanId = scannedId.trim();
            if (!cleanId) return;

            // Simple debounce prevent accidental multi-scans within 3 seconds
            const now = Date.now();
            if (cleanId === lastScannedId && (now - lastScanTime) < 3000) {
                return;
            }
            lastScanTime = now;
            lastScannedId = cleanId;

            let db = JSON.parse(localStorage.getItem('peaci_db'));
            let logs = JSON.parse(localStorage.getItem('peaci_attendance'));

            if (db[cleanId]) {
                const student = db[cleanId];
                const timestamp = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

                const record = {
                    time: timestamp,
                    id: cleanId,
                    name: student.name,
                    course: student.course,
                    synced: false
                };

                logs.unshift(record); // Add to beginning
                localStorage.setItem('peaci_attendance', JSON.stringify(logs));

                updateScreen("ATTENDANCE MARKED", `${student.name.toUpperCase()} (${student.course})`);
                renderLogs();

                if (navigator.onLine) {
                    syncAttendance();
                }
            } else {
                updateScreen("ACCESS DENIED", `ID ${cleanId} NOT REGISTERED`, "#ff3333");
            }
        }

        /* --- MANUAL / USB SCANNER HANDLER --- */
        function handleManualScan(e) {
            if (e.key === 'Enter') {
                const inputField = document.getElementById('manualScanId');
                processAttendance(inputField.value);
                inputField.value = '';
            }
        }

        /* --- CAMERA SCANNER INITIALIZATION --- */
        function initScanner() {
            if (typeof Html5QrcodeScanner === 'undefined') {
                console.error('Html5QrcodeScanner failed to load.');
                return;
            }

            const html5QrcodeScanner = new Html5QrcodeScanner(
                "reader", 
                { fps: 10, qrbox: { width: 200, height: 150 } },
                /* verbose= */ false
            );

            html5QrcodeScanner.render((decodedText) => {
                processAttendance(decodedText);
            }, (error) => {
                // Scanning active...
            });
        }

        /* --- RENDER LOGS TABLE --- */
        function renderLogs() {
            let logs = JSON.parse(localStorage.getItem('peaci_attendance')) || [];
            logTableBody.innerHTML = '';

            logs.slice(0, 10).forEach(log => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${log.time}</td>
                    <td>${log.id}</td>
                    <td>${log.name}</td>
                    <td>${log.course}</td>
                    <td class="sync-badge ${log.synced ? 'synced' : 'pending'}">${log.synced ? 'OK' : 'PENDING'}</td>
                `;
                logTableBody.appendChild(row);
            });
        }

        /* --- BACKEND SYNC (WHEN ONLINE) --- */
        function syncAttendance() {
            if (!navigator.onLine) return;

            let logs = JSON.parse(localStorage.getItem('peaci_attendance')) || [];
            let unsynced = logs.filter(item => !item.synced);

            if (unsynced.length === 0) return;

            // Replace with your remote API backend endpoint
            fetch('/api/attendance/sync', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(unsynced)
            })
            .then(res => {
                if (res.ok) {
                    const updatedLogs = logs.map(item => ({ ...item, synced: true }));
                    localStorage.setItem('peaci_attendance', JSON.stringify(updatedLogs));
                    renderLogs();
                }
            })
            .catch(err => console.log('Sync postponed; remote endpoint unreachable.', err));
        }

        // Service Worker Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((reg) => console.log('Service Worker registered! Scope:', reg.scope))
                    .catch((err) => console.log('Service Worker registration failed:', err));
            });
        }
    </script>
</body>
</html>
